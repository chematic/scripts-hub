<!doctype html><style>
body{margin:0;background:#111;color:white;display:grid;place-items:center;height:100vh}.tilt-card{--tilt-rx:0deg;--tilt-ry:0deg;--tilt-lift:0px;--tilt-scale:1;width:400px;height:240px;background:linear-gradient(135deg,#334,#111);border:1px solid #999;border-radius:20px;transform:perspective(1200px) rotateX(var(--tilt-rx)) rotateY(var(--tilt-ry)) translate3d(0,var(--tilt-lift),0) scale(var(--tilt-scale));transform-style:preserve-3d;transition:transform 420ms cubic-bezier(.2,.75,.2,1)}
</style><article class="tilt-card"><h1>TEST</h1></article><script>
(()=>{const rt={bound:false,active:null,frame:0,lastEvent:null};function resetTilt(card){card.classList.remove('is-hover','tilt-active');card.style.setProperty('--tilt-rx','0deg');card.style.setProperty('--tilt-ry','0deg');card.style.setProperty('--tilt-lift','0px');card.style.setProperty('--tilt-scale','1');card.style.transition='transform 420ms cubic-bezier(.2,.75,.2,1)'}function applyTilt(){rt.frame=0;const card=rt.active,e=rt.lastEvent;if(!card||!e)return;const r=card.getBoundingClientRect();const x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));const y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));const s=7;card.style.setProperty('--tilt-rx',((.5-y)*s).toFixed(2)+'deg');card.style.setProperty('--tilt-ry',((x-.5)*s).toFixed(2)+'deg');card.style.setProperty('--tilt-lift','-7px');card.style.setProperty('--tilt-scale','1.018')}function schedule(){if(!rt.frame)rt.frame=requestAnimationFrame(applyTilt)}function attachTilt(){if(rt.bound)return;rt.bound=true;document.addEventListener('mousemove',e=>{const t=e.target;const c=t instanceof Element?t.closest('.tilt-card'):null;if(!c){if(rt.active){resetTilt(rt.active);rt.active=null}return}if(rt.active!==c){if(rt.active)resetTilt(rt.active);rt.active=c;c.classList.add('is-hover','tilt-active');c.style.transition='transform 85ms linear'}rt.lastEvent=e;schedule()},{passive:true})}attachTilt();})();
</script>
